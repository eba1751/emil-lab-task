# Lab target machine configuration.
# Sourced by provision.sh and lab-health.sh.
# Adjust these values to match the real machine before running.

# Hostname to assign to the target machine
HOSTNAME="lab-target"

# How to reach the target from the Docker host
TARGET_IP="localhost"
TARGET_PORT="2222"

# Bootstrap credentials used only for the very first connection
BOOTSTRAP_USER="root"
BOOTSTRAP_PASSWORD="bootstrap"

# Lab user to create on the target
LAB_USER="device1"

# Packages to install on the target
PACKAGES="curl git autossh nodejs npm"

# Path to the SSH public key to install for the lab user
# SSH_PUBKEY="$HOME/.ssh/id_ed25519.pub"
SSH_PUBKEY="$HOME/.ssh/lab_id_ed25519.pub"

# How to reach the jumphost from the Docker host
JUMPHOST_IP="localhost"
JUMPHOST_PORT="2220"

# Port on the jumphost where the reverse tunnel terminates
JUMP1_TUNNEL_PORT="2205"

# Docker Compose service name of the jumphost
JUMP1_INTERNAL_HOST="jumphost"