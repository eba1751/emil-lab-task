      - ./scripts/target-init.sh:/init.sh
    command: bash /init.sh
    restart: unless-stopped

  jumphost:
    image: ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
    container_name: lab-jumphost
    hostname: lab-jumphost
    ports:
      - "2220:22"
      - "2205:2205"
    volumes:
      - ./scripts/jumphost-init.sh:/init.sh
    command: bash /init.sh
    restart: unless-stopped
