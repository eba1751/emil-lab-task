# Lab target machine configuration.
# Sourced by provision.sh and lab-health.sh.
# Adjust these values to match the real machine before running.

# Hostname to assign to the target machine
HOSTNAME="lab-target"

# How to reach the target from this machine (the Docker host)
TARGET_IP="localhost"
TARGET_PORT="2222"

# Bootstrap credentials used only for the very first connection.
# provision.sh disables password auth once keys are installed.
BOOTSTRAP_USER="root"
BOOTSTRAP_PASSWORD="bootstrap"

# Lab user to create on the target (no password, key-auth only, passwordless sudo)
LAB_USER="labuser"

# Path to the SSH public key to install for the lab user.
# The matching private key (same path without .pub) is used for all connections.
SSH_PUBKEY="~/.ssh/id_ed25519.pub"

# How to reach the jumphost from this machine (the Docker host)
JUMPHOST_IP="localhost"
JUMPHOST_PORT="2220"

# Port on the jumphost where the reverse tunnel terminates.
JUMPHOST_TUNNEL_PORT="2205"

# Internal hostname of the jumphost as seen from inside the Docker network.
JUMPHOST_INTERNAL_HOST="jumphost"
